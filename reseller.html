<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKY MODS - Reseller Portal</title>
    <style>
        :root {
            --bg-main: #0a0e17;
            --bg-card: #121927;
            --bg-input: #1a2336;
            --primary: #00e5ff;
            --violet: #a855f7;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: #232f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 860px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            color: var(--primary);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-dim);
        }

        .credit-badge {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            display: inline-block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        @media (min-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: 600;
        }

        input, select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .btn-main {
            background: linear-gradient(90deg, var(--primary), var(--violet));
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 14px;
            transition: 0.2s;
        }

        .btn-main:hover {
            opacity: 0.9;
        }

        .btn-main:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .cost-calculator {
            grid-column: 1 / -1;
            background: rgba(245, 158, 11, 0.1);
            border: 1px dashed var(--warning);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--warning);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 720px;
        }

        th {
            background-color: var(--bg-input);
            color: var(--text-dim);
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            white-space: nowrap;
        }

        .key-text {
            font-family: monospace;
            color: var(--primary);
            background: rgba(0, 229, 255, 0.08);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .device-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            font-family: monospace;
            font-size: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .status-blocked {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .action-btns {
            display: flex;
            gap: 5px;
        }

        .btn-sm {
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.15s;
        }

        .btn-copy {
            background: #24314c;
            color: #fff;
            border: 1px solid var(--border);
        }

        .btn-deactivate {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-activate {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .btn-delete {
            background: #1e1b2e;
            color: #e2e8f0;
            border: 1px solid var(--border);
        }

        .btn-delete:hover {
            background: var(--danger);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- AUTH SCREEN -->
    <div class="card" id="authView">
        <div class="header">
            <h1>SKY MODS</h1>
            <p>Authorized Reseller Portal</p>
        </div>
        <form onsubmit="handleResellerLogin(event)">
            <div class="form-group" style="margin-bottom: 14px;">
                <label>Reseller Username</label>
                <input type="text" id="resellerUsernameInput" placeholder="Enter assigned username" required>
            </div>
            <div class="form-group" style="margin-bottom: 14px;">
                <label>Password</label>
                <input type="password" id="resellerPasswordInput" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-main" id="loginBtn">Sign In</button>
        </form>
    </div>

    <!-- RESELLER DASHBOARD -->
    <div id="dashboardView" style="display: none;">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <div>
                    <span style="font-size: 12px; color: var(--text-dim);">Logged in Reseller:</span>
                    <b id="displayResellerName" style="color: var(--primary); margin-left: 4px;"></b>
                </div>
                <button class="btn-sm btn-copy" onclick="logout()">Sign Out</button>
            </div>

            <div style="text-align: center; margin-bottom: 20px;">
                <div class="credit-badge">Available Balance: <span id="displayResellerCredits">0</span> Credits</div>
            </div>

            <!-- KEY GENERATOR -->
            <form onsubmit="handleGenerateKey(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Customer Name</label>
                        <input type="text" id="buyerName" placeholder="e.g. John VIP" required>
                    </div>
                    <div class="form-group">
                        <label>Duration / Days</label>
                        <select id="keyDays" onchange="calculateCost()">
                            <option value="1">1 Day</option>
                            <option value="2">2 Days</option>
                            <option value="7">7 Days (1 Week)</option>
                            <option value="15">15 Days</option>
                            <option value="30">30 Days (1 Month)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Allowed Devices</label>
                        <select id="keyDevices" onchange="calculateCost()">
                            <option value="1">1 Device</option>
                            <option value="2">2 Devices</option>
                            <option value="3">3 Devices</option>
                            <option value="5">5 Devices</option>
                            <option value="10">10 Devices</option>
                            <option value="15">15 Devices</option>
                            <option value="100">100 Devices</option>
                            <option value="200">200 Devices</option>
                            <option value="Unlimited">Unlimited Devices</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Key Prefix</label>
                        <input type="text" id="keyPrefix" value="SKY" placeholder="e.g. SKY">
                    </div>

                    <div class="cost-calculator">
                        <span>Formula: <b>Days × Devices</b></span>
                        <b id="calculatedCostText">Cost: 1 Credit</b>
                    </div>
                </div>

                <button type="submit" class="btn-main" id="genKeyBtn">+ Generate Customer Key</button>
            </form>
        </div>

        <!-- GENERATED KEYS MANAGEMENT -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <div>
                    <h3 style="font-size: 16px; color: var(--primary);">Active Generated Keys</h3>
                    <span style="font-size: 11px; color: var(--text-dim);">Expired keys are automatically hidden</span>
                </div>
                <button class="btn-sm btn-copy" onclick="fetchMyKeys()">Refresh List</button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>License Key</th>
                            <th>Time Left</th>
                            <th>Devices (Used / Max)</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="resellerKeysTbody">
                        <tr><td colspan="6" style="text-align:center; padding: 16px;">Loading your active keys...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const FIREBASE_RESELLERS = "https://skymodsloader-default-rtdb.firebaseio.com/resellers";
    const FIREBASE_KEYS = "https://skymodsloader-default-rtdb.firebaseio.com/keys";

    let currentReseller = null;
    let myKeysList = [];

    function randomString(length = 4) {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let res = "";
        for (let i = 0; i < length; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
        return res;
    }

    function calculateCost() {
        const days = parseInt(document.getElementById("keyDays").value) || 1;
        const devVal = document.getElementById("keyDevices").value;
        const devMultiplier = devVal === "Unlimited" ? 50 : (parseInt(devVal) || 1);
        const cost = days * devMultiplier;
        document.getElementById("calculatedCostText").innerText = `Cost: ${cost} Credits (${days}d × ${devVal} dev)`;
        return cost;
    }

    async function handleResellerLogin(e) {
        e.preventDefault();
        const user = document.getElementById("resellerUsernameInput").value.trim().toLowerCase();
        const pass = document.getElementById("resellerPasswordInput").value.trim();
        const btn = document.getElementById("loginBtn");

        btn.disabled = true;

        try {
            const res = await fetch(`${FIREBASE_RESELLERS}/${user}.json`);
            const data = await res.json();

            if (!data || data.password !== pass) {
                alert("Invalid Reseller Username or Password!");
                btn.disabled = false;
                return;
            }

            if (data.status === "blocked") {
                alert("Your Reseller account has been blocked by Admin!");
                btn.disabled = false;
                return;
            }

            currentReseller = data;
            localStorage.setItem("sky_reseller_session", JSON.stringify(data));
            loadDashboard();
        } catch (err) {
            alert("Network Error: " + err.message);
        } finally {
            btn.disabled = false;
        }
    }

    function loadDashboard() {
        document.getElementById("authView").style.display = "none";
        document.getElementById("dashboardView").style.display = "block";
        document.getElementById("displayResellerName").innerText = currentReseller.username;
        document.getElementById("displayResellerCredits").innerText = currentReseller.credits || 0;
        calculateCost();
        fetchMyKeys();
    }

    async function handleGenerateKey(e) {
        e.preventDefault();
        const buyer = document.getElementById("buyerName").value.trim();
        const days = parseInt(document.getElementById("keyDays").value);
        const devices = document.getElementById("keyDevices").value;
        const prefix = document.getElementById("keyPrefix").value.trim() || "SKY";
        const cost = calculateCost();
        const btn = document.getElementById("genKeyBtn");

        if (currentReseller.credits < cost) {
            alert(`Insufficient credits! Required: ${cost} Credits, Available: ${currentReseller.credits} Credits.\nPlease contact Admin to recharge.`);
            return;
        }

        btn.disabled = true;
        btn.innerText = "Generating...";

        const newKey = `${prefix}-R4X-${randomString(4)}-${randomString(4)}`;
        let exp = new Date();
        exp.setDate(exp.getDate() + days);

        const keyData = {
            customer_name: buyer,
            key: newKey,
            key_type: "mod_menu",
            durationDays: days,
            expires_at: exp.toISOString(),
            max_devices: devices,
            bound_devices: "",
            status: "active",
            created_by: currentReseller.username,
            credits_deducted: cost,
            created_at: new Date().toISOString()
        };

        const remainingCredits = currentReseller.credits - cost;
        const totalKeys = (currentReseller.total_keys_generated || 0) + 1;

        try {
            await fetch(`${FIREBASE_KEYS}/${newKey}.json`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(keyData)
            });

            await fetch(`${FIREBASE_RESELLERS}/${currentReseller.username}.json`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    credits: remainingCredits,
                    total_keys_generated: totalKeys
                })
            });

            currentReseller.credits = remainingCredits;
            currentReseller.total_keys_generated = totalKeys;
            localStorage.setItem("sky_reseller_session", JSON.stringify(currentReseller));
            document.getElementById("displayResellerCredits").innerText = remainingCredits;

            alert(`Key Generated Successfully!\nKey: ${newKey}\nCredits Deducted: ${cost}`);
            document.getElementById("buyerName").value = "";
            fetchMyKeys();
        } catch (err) {
            alert("Error: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "+ Generate Customer Key";
        }
    }

    async function fetchMyKeys() {
        const tbody = document.getElementById("resellerKeysTbody");
        try {
            const res = await fetch(`${FIREBASE_KEYS}.json`);
            const data = await res.json();
            const allKeys = data ? Object.values(data).reverse() : [];
            const now = new Date().getTime();
            
            // STRICT FILTER: Reseller's own keys AND NOT expired
            myKeysList = allKeys.filter(k => {
                if (k.created_by !== currentReseller.username) return false;
                const expiry = new Date(k.expires_at).getTime();
                if (expiry <= now) return false; // AUTO-REMOVE EXPIRED KEYS
                return true;
            });

            if (myKeysList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 16px; color:var(--text-dim);">No active keys found.</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            myKeysList.forEach(k => {
                // Device Bound Calculation
                let boundCount = 0;
                if (k.bound_devices) {
                    if (Array.isArray(k.bound_devices)) {
                        boundCount = k.bound_devices.filter(Boolean).length;
                    } else if (typeof k.bound_devices === "object") {
                        boundCount = Object.keys(k.bound_devices).length;
                    } else if (typeof k.bound_devices === "string") {
                        const str = k.bound_devices.trim();
                        if (str !== "") {
                            boundCount = str.includes(",") ? str.split(",").filter(Boolean).length : 1;
                        }
                    }
                }

                const maxDevStr = k.max_devices || "1";
                const isLimitReached = (maxDevStr !== "Unlimited" && boundCount >= parseInt(maxDevStr));

                const deviceBadge = `
                    <span class="device-badge" style="background: ${boundCount > 0 ? (isLimitReached ? 'rgba(239, 68, 68, 0.15)' : 'rgba(245, 158, 11, 0.15)') : 'rgba(148, 163, 184, 0.1)'}; 
                                                      color: ${boundCount > 0 ? (isLimitReached ? 'var(--danger)' : 'var(--warning)') : 'var(--text-dim)'}; 
                                                      border: 1px solid ${boundCount > 0 ? (isLimitReached ? 'var(--danger)' : 'var(--warning)') : 'var(--border)'};">
                        ${boundCount} / ${maxDevStr} Logged
                    </span>
                `;

                // Calculate Remaining Time
                const diff = new Date(k.expires_at).getTime() - now;
                const daysLeft = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hoursLeft = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const timeLeftText = `${daysLeft}d ${hoursLeft}h`;

                const isBlocked = k.status === "blocked";
                const statusBadge = isBlocked 
                    ? `<span class="status-badge status-blocked">Blocked</span>` 
                    : `<span class="status-badge status-active">Active</span>`;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td style="color:#fff; font-weight:600;">${k.customer_name}</td>
                    <td><span class="key-text">${k.key}</span></td>
                    <td style="color:var(--text-dim);">${timeLeftText}</td>
                    <td>${deviceBadge}</td>
                    <td>${statusBadge}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-sm btn-copy" onclick="copyKey('${k.key}')">Copy</button>
                            ${isBlocked 
                                ? `<button class="btn-sm btn-activate" onclick="toggleKeyStatus('${k.key}', 'active')">Activate</button>`
                                : `<button class="btn-sm btn-deactivate" onclick="toggleKeyStatus('${k.key}', 'blocked')">Block</button>`
                            }
                            <button class="btn-sm btn-delete" onclick="deleteMyKey('${k.key}')">Delete</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error(e);
        }
    }

    async function toggleKeyStatus(key, newStatus) {
        const target = myKeysList.find(k => k.key === key);
        if (!target) return;

        const actionWord = newStatus === "blocked" ? "Block" : "Activate";
        if (!confirm(`Are you sure you want to ${actionWord} key: ${key}?`)) return;

        try {
            await fetch(`${FIREBASE_KEYS}/${key}.json`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: newStatus })
            });
            fetchMyKeys();
        } catch (err) {
            alert("Error updating key: " + err.message);
        }
    }

    async function deleteMyKey(key) {
        const target = myKeysList.find(k => k.key === key);
        if (!target) return;

        if (!confirm(`Are you sure you want to delete key: ${key}?`)) return;

        try {
            await fetch(`${FIREBASE_KEYS}/${key}.json`, { method: "DELETE" });
            fetchMyKeys();
        } catch (err) {
            alert("Error deleting key: " + err.message);
        }
    }

    function copyKey(k) {
        navigator.clipboard.writeText(k).then(() => alert("Copied: " + k));
    }

    function logout() {
        localStorage.removeItem("sky_reseller_session");
        location.reload();
    }

    window.onload = function() {
        const saved = localStorage.getItem("sky_reseller_session");
        if (saved) {
            currentReseller = JSON.parse(saved);
            fetch(`${FIREBASE_RESELLERS}/${currentReseller.username}.json`)
                .then(r => r.json())
                .then(data => {
                    if (data && data.status !== "blocked") {
                        currentReseller = data;
                        localStorage.setItem("sky_reseller_session", JSON.stringify(data));
                        loadDashboard();
                    } else {
                        logout();
                    }
                })
                .catch(() => loadDashboard());
        }
    };
</script>
</body>
</html>
